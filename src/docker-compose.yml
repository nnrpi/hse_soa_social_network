# version: '3.8'

services:
  proxy-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./proxy-service/Dockerfile.simple
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user-service:8000
      - POST_SERVICE_URL=post-service:9000
      - POSTS_API_SERVICE_URL=http://posts-api-service:8090
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=socialnetwork
    depends_on:
      - user-service
      - post-service
      - posts-api-service
      - postgres
    networks:
      - social-network

  user-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./user-service/Dockerfile.simple
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=socialnetwork
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - social-network

  post-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./post-service/Dockerfile.simple
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=socialnetwork
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - social-network

  posts-api-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./posts-api-service/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - POSTS_GRPC_SERVICE_URL=posts-grpc-service:9090
    depends_on:
      - posts-grpc-service
    networks:
      - social-network

  posts-grpc-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./posts-grpc-service/Dockerfile
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=socialnetwork
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - social-network

  postgres:
    platform: linux/amd64
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=socialnetwork
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - social-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    networks:
      - social-network

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "post_views:1:1,post_comments:1:1,post_interactions:1:1,user_registrations:1:1"
    depends_on:
      - zookeeper
    networks:
      - social-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --list --zookeeper zookeeper:2181"]
      interval: 10s
      timeout: 20s
      retries: 5

networks:
  social-network:
    driver: bridge

volumes:
  postgres-data:

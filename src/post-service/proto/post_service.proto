syntax = "proto3";

package post;

option go_package = "social-network/post-service/pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service PostService {
  rpc CreatePost(CreatePostRequest) returns (Post);
  rpc GetPost(GetPostRequest) returns (Post);
  rpc UpdatePost(UpdatePostRequest) returns (Post);
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  
  rpc CreatePromo(CreatePromoRequest) returns (Promo);
  rpc GetPromo(GetPromoRequest) returns (Promo);
  rpc UpdatePromo(UpdatePromoRequest) returns (Promo);
  rpc DeletePromo(DeletePromoRequest) returns (google.protobuf.Empty);
  rpc ListPromos(ListPromosRequest) returns (ListPromosResponse);
}

message Post {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 creator_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  bool is_private = 7;
  repeated string tags = 8;
}

message CreatePostRequest {
  string title = 1;
  string description = 2;
  int64 creator_id = 3;
  bool is_private = 4;
  repeated string tags = 5;
}

message GetPostRequest {
  string id = 1;
  int64 user_id = 2;
}

message UpdatePostRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 creator_id = 4;
  bool is_private = 5;
  repeated string tags = 6;
}

message DeletePostRequest {
  string id = 1;
  int64 creator_id = 2;
}

message ListPostsRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 user_id = 3;
}

message ListPostsResponse {
  repeated Post posts = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message Promo {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 creator_id = 4;
  double discount = 5;
  string code = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreatePromoRequest {
  string title = 1;
  string description = 2;
  int64 creator_id = 3;
  double discount = 4;
  string code = 5;
}

message GetPromoRequest {
  string id = 1;
  int64 user_id = 2;
}

message UpdatePromoRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  int64 creator_id = 4;
  double discount = 5;
  string code = 6;
}

message DeletePromoRequest {
  string id = 1;
  int64 creator_id = 2;
}

message ListPromosRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 user_id = 3;
}

message ListPromosResponse {
  repeated Promo promos = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}
